{% extends "base.html" %}
{% block content %}

<div class="card shadow p-4 mx-auto text-center" style="max-width: 400px;">
  <h3>Payment</h3>

  <p class="mt-3">Amount to Pay</p>
  <h2 class="fw-bold">₹{{ amount }}</h2>

    Demo mode: payment verified manually by shop
  </p>
</div>

{% endblock %}
