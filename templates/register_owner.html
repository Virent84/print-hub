<!DOCTYPE html>
<html>
<head>
    <title>Register Shop</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h2>Register Xerox Shop</h2>

    <form method="POST">
        <input name="username" placeholder="Shop Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="number" name="bw_price" placeholder="B/W Price" required>
        <input type="number" name="color_price" placeholder="Color Price" required>
        <input name="upi_id" placeholder="UPI ID" required>
        <button>Register</button>
    </form>
</div>
</body>
</html>
