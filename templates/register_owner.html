{% extends "base.html" %}
{% block content %}

<div class="card shadow p-4 mx-auto" style="max-width: 500px;">
  <h3 class="mb-3 text-center">Register Xerox Shop</h3>

  <form method="POST">
    <input class="form-control mb-3" name="username" placeholder="Shop Username" required>
    <input type="password" class="form-control mb-3" name="password" placeholder="Password" required>
    <input type="number" class="form-control mb-3" name="bw_price" placeholder="B/W Price (₹)" required>
    <input type="number" class="form-control mb-3" name="color_price" placeholder="Color Price (₹)" required>
    <input class="form-control mb-3" name="upi_id" placeholder="UPI ID" required>

    <button class="btn btn-primary w-100">Register</button>
  </form>
</div>

{% endblock %}
