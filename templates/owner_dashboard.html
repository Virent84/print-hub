<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h2>Dashboard – {{ owner }}</h2>

    {% if orders %}
    <table>
        <tr>
            <th>ID</th><th>Customer</th><th>File</th>
            <th>Amount</th><th>Status</th><th>Action</th>
        </tr>

        {% for o in orders %}
        <tr>
            <td>{{ o.id }}</td>
            <td>{{ o.customer_name }}</td>
            <td>{{ o.filename }}</td>
            <td>₹{{ o.amount }}</td>
            <td>{{ o.status }}</td>
            <td>
                <a href="/status/{{ o.id }}/PAID">PAID</a> |
                <a href="/status/{{ o.id }}/PRINTING">PRINT</a> |
                <a href="/status/{{ o.id }}/READY">READY</a> |
                <a href="/status/{{ o.id }}/COMPLETED">DONE</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>No orders yet</p>
    {% endif %}
</div>
</body>
</html>
