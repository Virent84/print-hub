{% extends "base.html" %}
{% block body %}
<h3>{{owner.shop_name}} Dashboard</h3>
<table class="table table-bordered">
<tr><th>File</th><th>Pages</th><th>Status</th></tr>
{% for o in orders %}
<tr>
<td>{{o.filename}}</td>
<td>{{o.pages}}</td>
<td>{{o.status}}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
