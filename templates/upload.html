{% extends "base.html" %}
{% block body %}
<h3>Upload – {{owner.shop_name}}</h3>
<form method="post" enctype="multipart/form-data">
<input type="file" name="file" class="form-control mb-2">

<select name="paper" class="form-control mb-2">
{% for p in owner.paper_sizes.split(",") %}
<option>{{p}}</option>
{% endfor %}
</select>

<select name="mode" class="form-control mb-2">
{% for m in owner.print_modes.split(",") %}
<option>{{m}}</option>
{% endfor %}
</select>

<select name="orientation" class="form-control mb-2">
{% for o in owner.orientations.split(",") %}
<option>{{o}}</option>
{% endfor %}
</select>

<select name="side" class="form-control mb-2">
{% for s in owner.sides.split(",") %}
<option>{{s}}</option>
{% endfor %}
</select>

<input name="pages" placeholder="All or 1-3,5" class="form-control mb-2">
<button class="btn btn-primary">Upload</button>
</form>
{% endblock %}
