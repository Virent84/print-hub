<!DOCTYPE html>
<html>
<head>
    <title>Customer Upload</title>
</head>
<body>
    <h2>Customer Upload Page</h2>

    <form method="POST" enctype="multipart/form-data">
        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Select file:</label><br>
        <input type="file" name="file" required><br><br>

        <label>Number of copies:</label><br>
        <input type="number" name="copies" min="1" value="1" required><br><br>

        <label>Print type:</label><br>
        <select name="print_type">
            <option value="bw">Black & White</option>
            <option value="color">Color</option>
        </select><br><br>

        <button type="submit">Upload & Continue</button>
    </form>
</body>
</html>
